<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Surreal Mystic Tarot — Salvador Dalí Edition</title>
    <style>
        :root {
            --bg-color: #09070f;
            --card-bg: #150f24;
            --accent-gold: #f3e5ab;
            --accent-gold-glow: rgba(243, 229, 171, 0.35);
            --border-purple: #4a3b75;
            --text-purple: #e0d9f6;
            --sub-purple: #b1a7d8;
            --panel-bg: rgba(22, 16, 38, 0.92);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-purple);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            text-align: center;
            padding: 16px;
            min-height: 100vh;
            background-image: 
                radial-gradient(circle at 50% 10%, rgba(74, 59, 117, 0.15), transparent 60%),
                radial-gradient(circle at 20% 80%, rgba(243, 229, 171, 0.05), transparent 40%);
        }

        h1 { 
            color: var(--accent-gold); 
            margin: 10px 0 4px 0; 
            font-size: 1.8rem;
            letter-spacing: 1.5px;
            text-shadow: 0 0 12px var(--accent-gold-glow);
        }

        p.subtitle { 
            color: var(--sub-purple); 
            font-size: 0.85rem; 
            margin-bottom: 20px; 
            font-style: italic;
        }

        .main-nav {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
        }

        .tab-btn {
            background: var(--card-bg);
            color: var(--sub-purple);
            border: 1px solid var(--border-purple);
            padding: 10px 18px;
            font-size: 0.9rem;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s ease;
        }

        .tab-btn.active {
            background: linear-gradient(135deg, #4a154b, #2b0b30);
            color: var(--accent-gold);
            border-color: var(--accent-gold);
            box-shadow: 0 0 10px var(--accent-gold-glow);
        }

        .panel {
            display: none;
            max-width: 600px;
            margin: 0 auto;
        }

        .panel.active {
            display: block;
        }
