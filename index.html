<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Surreal Mystic Tarot — Dalí Edition</title>
    <style>
        :root {
            --bg-color: #0b0813;
            --card-bg: #161124;
            --accent-gold: #f3e5ab;
            --border-purple: #4a3b75;
            --text-purple: #d1c7f3;
            --sub-purple: #b1a7d8;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-purple);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            text-align: center;
            padding: 16px;
            margin: 0;
            min-height: 100vh;
        }

        h1 { 
            color: var(--accent-gold); 
            margin: 10px 0 5px 0; 
            font-size: 1.8rem;
            letter-spacing: 1px;
            text-shadow: 0 0 10px rgba(243, 229, 171, 0.2);
        }

        p.subtitle { 
            color: var(--sub-purple); 
            font-size: 0.85rem; 
            margin-bottom: 20px; 
        }

        .controls {
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-width: 340px;
            margin: 0 auto 25px auto;
        }

        select {
            background-color: var(--card-bg);
            color: var(--accent-gold);
            border: 1px solid var(--border-purple);
            padding: 12px;
            font-size: 0.95rem;
            border-radius: 10px;
            outline: none;
            text-align: center;
        }

        button {
            background: linear-gradient(135deg, #4a154b, #2b0b30);
            color: var(--accent-gold);
            border: 2px solid var(--accent-gold);
            padding: 14px 28px;
            font-size: 1.1rem;
            border-radius: 12px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(0,0,0,0.6);
            transition: transform 0.1s;
        }

        button:active { 
            transform: scale(0.97); 
        }
