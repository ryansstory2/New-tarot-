<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dalí Surreal Tarot Readings</title>
    <style>
        :root {
            --bg-color: #0b0813;
            --card-bg: #161124;
            --accent-gold: #f3e5ab;
            --border-purple: #4a3b75;
            --text-purple: #d1c7f3;
            --sub-purple: #b1a7d8;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-purple);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 {
            color: var(--accent-gold);
            font-size: 1.5rem;
            text-align: center;
            margin-bottom: 20px;
            letter-spacing: 1px;
        }
        .container {
            width: 100%;
            max-width: 600px;
        }
        .menu-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
        }
        button.spread-btn {
            background: linear-gradient(135deg, #4a235a, #2c1638);
            color: var(--accent-gold);
            border: 1px solid var(--border-purple);
            padding: 15px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: center;
        }
        button.spread-btn:hover {
            background: linear-gradient(135deg, #6c3483, #4a235a);
            border-color: var(--accent-gold);
        }
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .action-btn {
            background: #311b4a;
            color: var(--accent-gold);
            border: 1px solid var(--border-purple);
            padding: 8px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }
        .card-box {
            background-color: var(--card-bg);
            border: 1px solid var(--border-purple);
            border-radius: 8px;
            padding: 10px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .card-position {
            color: var(--accent-gold);
            font-size: 0.85rem;
            font-weight: bold;
            margin-bottom: 8px;
        }
        .card-img {
            width: 120px;
            height: 180px;
            object-fit: cover;
            border-radius: 4px;
            border: 1px solid var(--border-purple);
            background-color: #221533;
        }
        .card-info {
            margin-top: 8px;
            font-size: 0.85rem;
        }
        .card-name {
            font-weight: bold;
            color: #fff;
        }
        .card-keywords {
            font-style: italic;
            color: var(--sub-purple);
            font-size: 0.8rem;
            margin-top: 3px;
        }
        .summary-box {
            background-color: var(--card-bg);
            border: 1px solid var(--border-purple);
            border-radius: 8px;
            padding: 15px;
            margin-top: 15px;
        }
        .summary-box h3 {
            color: var(--accent-gold);
            margin-top: 0;
            font-size: 1.1rem;
        }
        .hidden {
            display: none;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🎨 DALÍ SURREAL TAROT</h1>

    <!-- MENU VIEW -->
    <div id="menu-view" class="menu-grid">
        <button class="spread-btn" onclick="startReading('1_card')">Single Lens (1 Card)</button>
        <button class="spread-btn" onclick="startReading('3_card')">Melting Timeline (3 Cards)</button>
        <button class="spread-btn" onclick="startReading('5_card')">Infinite Clock (5 Cards)</button>
        <button class="spread-btn" onclick="startReading('lovers')">Lovers Alignment Spread</button>
        <button class="spread-btn" onclick="startReading('career')">Career Horizon Spread</button>
        <button class="spread-btn" onclick="startReading('celtic')">Celtic Cross Spread (10 Cards)</button>
    </div>
