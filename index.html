<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dalí Surreal Tarot Readings</title>
    <style>
        :root {
            --bg-color: #0b0813;
            --card-bg: #161124;
            --accent-gold: #f3e5ab;
            --border-purple: #4a3b75;
            --text-purple: #d1c7f3;
            --sub-purple: #b1a7d8;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-purple);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 {
            color: var(--accent-gold);
            font-size: 1.5rem;
            text-align: center;
            margin-bottom: 20px;
            letter-spacing: 1px;
        }
        .container {
            width: 100%;
            max-width: 600px;
        }
        .menu-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
        }
        button.spread-btn {
            background: linear-gradient(135deg, #4a235a, #2c1638);
            color: var(--accent-gold);
            border: 1px solid var(--border-purple);
            padding: 15px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: center;
        }
        button.spread-btn:hover {
            background: linear-gradient(135deg, #6c3483, #4a235a);
            border-color: var(--accent-gold);
        }
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .action-btn {
            background: #311b4a;
            color: var(--accent-gold);
            border: 1px solid var(--border-purple);
            padding: 8px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }
        .card-box {
            background-color: var(--card-bg);
            border: 1px solid var(--border-purple);
            border-radius: 8px;
            padding: 10px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .card-position {
            color: var(--accent-gold);
            font-size: 0.85rem;
            font-weight: bold;
            margin-bottom: 8px;
        }
        .card-img {
            width: 120px;
            height: 180px;
            object-fit: cover;
            border-radius: 4px;
            border: 1px solid var(--border-purple);
            background-color: #221533;
        }
        .card-info {
            margin-top: 8px;
            font-size: 0.85rem;
        }
        .card-name {
            font-weight: bold;
            color: #fff;
        }
        .card-keywords {
            font-style: italic;
            color: var(--sub-purple);
            font-size: 0.8rem;
            margin-top: 3px;
        }
        .summary-box {
            background-color: var(--card-bg);
            border: 1px solid var(--border-purple);
            border-radius: 8px;
            padding: 15px;
            margin-top: 15px;
        }
        .summary-box h3 {
            color: var(--accent-gold);
            margin-top: 0;
            font-size: 1.1rem;
        }
        .hidden {
            display: none;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🎨 DALÍ SURREAL TAROT</h1>

    <!-- MENU VIEW -->
    <div id="menu-view" class="menu-grid">
        <button class="spread-btn" onclick="startReading('1_card')">Single Lens (1 Card)</button>
        <button class="spread-btn" onclick="startReading('3_card')">Melting Timeline (3 Cards)</button>
        <button class="spread-btn" onclick="startReading('5_card')">Infinite Clock (5 Cards)</button>
        <button class="spread-btn" onclick="startReading('lovers')">Lovers Alignment Spread</button>
        <button class="spread-btn" onclick="startReading('career')">Career Horizon Spread</button>
        <button class="spread-btn" onclick="startReading('celtic')">Celtic Cross Spread (10 Cards)</button>
    </div>

    <!-- READING VIEW -->
    <div id="reading-view" class="hidden">
        <div class="top-bar">
            <button class="action-btn" onclick="showMenu()">← MENU</button>
            <span id="reading-title" style="font-weight: bold; color: var(--accent-gold);"></span>
            <button class="action-btn" onclick="generateReading()">🔄 REDRAW</button>
        </div>

        <div id="cards-container" class="cards-grid"></div>

        <div class="summary-box">
            <h3>Reading Summary & Synthesis</h3>
            <div id="summary-content" style="font-size: 0.9rem; line-height: 1.5;"></div>
        </div>
    </div>
</div>

<script>
const TAROT_CARDS = [
    {filename: "660.jpg", name: "0: The Fool", keywords: "Beginnings, Spontaneity, Leap of Faith", desc: "Taking a surreal leap into the unknown, trusting the unfolding journey."},
    {filename: "645.jpg", name: "I: The Magician", keywords: "Manifestation, Power, Skill", desc: "Transforming vision into reality using pure willpower and focused intention."},
    {filename: "659.jpg", name: "II: The High Priestess", keywords: "Intuition, Mysteries, Subconscious", desc: "Accessing deep inner wisdom and quiet knowledge hidden behind the veil."},
    {filename: "647.jpg", name: "III: The Empress", keywords: "Abundance, Nurturing, Creation", desc: "Lush growth, creative fertility, and grounding organic harmony."},
    {filename: "643.jpg", name: "IV: The Emperor", keywords: "Structure, Authority, Control", desc: "Establishing order, solid foundations, and strategic leadership amidst chaos."},
    {filename: "648.jpg", name: "V: The Hierophant", keywords: "Tradition, Guidance, Beliefs", desc: "Seeking conventional wisdom, formal alignment, and institutional knowledge."},
    {filename: "649.jpg", name: "VI: The Lovers", keywords: "Union, Harmony, Choices", desc: "Deep personal alignment, key choices, and emotional union."},
    {filename: "640.jpg", name: "X: The Wheel of Fortune", keywords: "Cycles, Destiny, Turning Points", desc: "The constant turning of fortune, shifting epochs, and inevitable change."},
    {filename: "650.jpg", name: "XI: Justice", keywords: "Fairness, Truth, Balance", desc: "Evaluating cause and effect, standing firm in complete truth and equilibrium."},
    {filename: "653.jpg", name: "XII: The Hanged Man", keywords: "Surrender, New Perspective, Pause", desc: "Viewing the world from a suspended vantage point to gain enlightenment."},
    {filename: "652.jpg", name: "XIII: Death", keywords: "Endings, Transformation, Transition", desc: "Sweeping away old structures to clear space for new rebirth."},
    {filename: "651.jpg", name: "XIV: Temperance", keywords: "Balance, Moderation, Purpose", desc: "Alchemical blending of opposing forces to achieve inner equilibrium."},
    {filename: "656.jpg", name: "XV: The Devil", keywords: "Attachment, Shadow Self, Restraint", desc: "Recognizing material illusions and breaking free from self-imposed chains."},
    {filename: "654.jpg", name: "XVI: The Tower", keywords: "Awakening, Sudden Change, Revelation", desc: "Shattering false structures in an instant to reveal fundamental truth."},
    {filename: "655.jpg", name: "XVII: The Star", keywords: "Hope, Faith, Renewal", desc: "A bright guiding light offering peace, inspiration, and cosmic direction."},
    {filename: "658.jpg", name: "XVIII: The Moon", keywords: "Illusion, Intuition, Fears", desc: "Navigating uncertainties and subconscious shadows under the pale night."},
    {filename: "644.jpg", name: "XXI: The World", "keywords": "Completion, Integration, Accomplishment", desc: "Reaching full wholeness, integration, and mastering the full journey."}
];

const SPREAD_CONFIGS = {
    "1_card": { title: "Single Lens (1 Card)", positions: ["Focus / Core Insight"] },
    "3_card": { title: "Melting Timeline (3 Cards)", positions: ["Past / Foundation", "Present / Current Flow", "Future / Horizon"] },
    "5_card": { title: "Infinite Clock (5 Cards)", positions: ["Present Condition", "Hidden Influence", "Core Obstacle", "Action Path", "Potential Outcome"] },
    "lovers": { title: "Lovers Alignment Spread", positions: ["Your Perspective", "Partner/Other's Energy", "Dynamic Connection", "Strengths", "Future Synthesis"] },
    "career": { title: "Career Horizon Spread", positions: ["Current Status", "Opportunities", "Challenges", "Required Skill", "Career Direction"] },
    "celtic": { title: "Celtic Cross Spread (10 Cards)", positions: ["1. Present State", "2. Immediate Challenge", "3. Distant Past", "4. Recent Past", "5. Best Outcome", "6. Immediate Future", "7. Self Attitude", "8. Environment", "9. Hopes & Fears", "10. Final Resolution"] }
};

let currentSpreadKey = "1_card";

function startReading(key) {
    currentSpreadKey = key;
    document.getElementById('menu-view').classList.add('hidden');
    document.getElementById('reading-view').classList.remove('hidden');
    document.getElementById('reading-title').innerText = SPREAD_CONFIGS[key].title;
    generateReading();
}

function showMenu() {
    document.getElementById('reading-view').classList.add('hidden');
    document.getElementById('menu-view').classList.remove('hidden');
}

function shuffleArray(array) {
    let arr = [...array];
    for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
}

function generateReading() {
    const config = SPREAD_CONFIGS[currentSpreadKey];
    const positions = config.positions;
    const shuffled = shuffleArray(TAROT_CARDS);
    const drawnCards = shuffled.slice(0, positions.length);

    const container = document.getElementById('cards-container');
    container.innerHTML = '';

    drawnCards.forEach((card, index) => {
        const box = document.createElement('div');
        box.className = 'card-box';
        box.innerHTML = `
            <div class="card-position">${positions[index]}</div>
            <img class="card-img" src="${card.filename}" alt="${card.name}" onerror="this.src='https://via.placeholder.com/120x180?text=Dal%C3%AD+Card'">
            <div class="card-info">
                <div class="card-name">${card.name}</div>
                <div class="card-keywords">${card.keywords}</div>
            </div>
        `;
        container.appendChild(box);
    });

    generateSummary(config.title, positions, drawnCards);
}

function generateSummary(title, positions, cards) {
    const coreThemes = cards.map(c => c.keywords.split(',')[0]);
    let html = `<strong>Synthesis for ${title}:</strong><br><br>`;
    html += `• <strong>Dominant Energies:</strong> ${coreThemes.join(', ')}<br><br>`;
    html += `• <strong>Card Progression:</strong><br>`;
    
    positions.forEach((pos, idx) => {
        html += `&nbsp;&nbsp;&nbsp;&nbsp;- <strong>${pos}:</strong> ${cards[idx].name} emphasizes <em>${cards[idx].keywords}</em>.<br>`;
    });

    html += `<br>• <strong>Surreal Outlook:</strong><br>`;
    html += `The presence of <strong>${cards[0].name}</strong> as the foundation paired with <strong>${cards[cards.length - 1].name}</strong> in the closing position indicates a shift from initial momentum toward complete resolution across your timeline.`;

    document.getElementById('summary-content').innerHTML = html;
}
</script>

</body>
</html>
